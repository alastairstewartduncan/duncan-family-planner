name: Firebase functions

on:
  push:
    branches: [main]
    paths: ["firebase/**", ".github/workflows/functions.yml"]
  pull_request:
    paths: ["firebase/**"]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy functions and Firestore rules to Firebase"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci || npm install
      - run: npm test

  deploy:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm --prefix functions ci || npm --prefix functions install
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: npx firebase-tools@13 deploy --only functions,firestore --project "${{ vars.FIREBASE_PROJECT_ID }}" --force
